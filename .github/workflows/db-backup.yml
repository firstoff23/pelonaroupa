name: Database Backup

on:
  schedule:
    # Execução diária às 04:00 UTC (horário de baixo tráfego)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export DB dump to artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify PostgreSQL client tools
        run: |
          if ! command -v pg_dump &> /dev/null; then
            echo "pg_dump não encontrado por padrão; a instalar postgresql-client..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          else
            echo "✅ pg_dump já disponível no runner: $(pg_dump --version)"
          fi

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurado nos secrets — backup cancelado com segurança."
            echo "Para ativar o backup automático, configure o secret SUPABASE_DB_URL (Connection String Session mode)."
            exit 0
          fi

          set -o pipefail

          # Mascara a connection string completa contra vazamento acidental em logs
          echo "::add-mask::$DATABASE_URL"

          # Validação se a URL for IPv6-only (pré-check)
          if echo "$DATABASE_URL" | grep -q "db\..*\.supabase\.co"; then
            echo "::error::A connection string aponta para 'db.[ref].supabase.co' (IPv6-only)."
            echo "::error::Os runners do GitHub Actions são IPv4-only. Usa Session Pooler:"
            echo "::error::postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres"
            exit 1
          fi

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_DIR="backups"
          BACKUP_FILE="${BACKUP_DIR}/pelonaroupa_${TIMESTAMP}.sql.gz"

          mkdir -p "$BACKUP_DIR"

          echo "A iniciar exportação do esquema public da base de dados..."

          # Exporta o esquema public sem donos nem privilégios específicos para portabilidade máxima
          if ! pg_dump "$DATABASE_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "$BACKUP_FILE"; then
            echo "::error::pg_dump falhou ao exportar a base de dados (ver erros acima)"
            exit 1
          fi

          # Validar o conteúdo descomprimido
          DECOMPRESSED_LINES=$(gunzip -c "$BACKUP_FILE" | wc -l)
          if [ "$DECOMPRESSED_LINES" -lt 10 ]; then
            echo "::error::Backup vazio ou truncado ($DECOMPRESSED_LINES linhas descomprimidas)"
            exit 1
          fi

          FILESIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "✅ Backup gerado com sucesso: $BACKUP_FILE ($FILESIZE, $DECOMPRESSED_LINES linhas descomprimidas)"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: warn
