name: Database Backup

on:
  schedule:
    # Execução diária às 04:00 UTC (horário de baixo tráfego)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export DB dump to artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client tools
        run: |
          # O runner ubuntu-latest traz pg_dump 15/16 por defeito.
          # O Supabase usa PostgreSQL 17.6, e o pg_dump recusa
          # fazer dump de um servidor mais recente que ele próprio.
          # Instalar o cliente 17 do repositório oficial PGDG.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wget gnupg lsb-release ca-certificates

          # Configurar chave e repositório oficial PGDG (modern signed-by keyring standard)
          sudo install -d -m 0755 /etc/apt/keyrings
          wget --quiet -O- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg

          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          # Instalar cliente PostgreSQL 17
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17

          # Adicionar binários PostgreSQL 17 ao PATH com prioridade
          if [ -d "/usr/lib/postgresql/17/bin" ]; then
            echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
            export PATH="/usr/lib/postgresql/17/bin:$PATH"
          fi

          # Verificar a versão instalada
          pg_dump --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SUPABASE_DB_URL não configurado nos secrets — backup cancelado com segurança."
            echo "Para ativar o backup automático, configure o secret SUPABASE_DB_URL (Connection String Session mode)."
            exit 0
          fi

          set -o pipefail

          # Mascara a connection string completa contra vazamento acidental em logs
          echo "::add-mask::$DATABASE_URL"

          # Validação se a URL for IPv6-only (pré-check)
          if echo "$DATABASE_URL" | grep -q "db\..*\.supabase\.co"; then
            echo "::error::A connection string aponta para 'db.[ref].supabase.co' (IPv6-only)."
            echo "::error::Os runners do GitHub Actions são IPv4-only. Usa Session Pooler:"
            echo "::error::postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:5432/postgres"
            exit 1
          fi

          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_DIR="backups"
          BACKUP_FILE="${BACKUP_DIR}/pelonaroupa_${TIMESTAMP}.sql.gz"

          mkdir -p "$BACKUP_DIR"

          echo "A iniciar exportação do esquema public da base de dados..."

          # Exporta o esquema public sem donos nem privilégios específicos para portabilidade máxima
          if ! pg_dump "$DATABASE_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --no-acl \
            --clean \
            --if-exists \
            | gzip > "$BACKUP_FILE"; then
            echo "::error::pg_dump falhou ao exportar a base de dados (ver erros acima)"
            exit 1
          fi

          # Validar o conteúdo descomprimido
          DECOMPRESSED_LINES=$(gunzip -c "$BACKUP_FILE" | wc -l)
          if [ "$DECOMPRESSED_LINES" -lt 10 ]; then
            echo "::error::Backup vazio ou truncado ($DECOMPRESSED_LINES linhas descomprimidas)"
            exit 1
          fi

          FILESIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "✅ Backup gerado com sucesso: $BACKUP_FILE ($FILESIZE, $DECOMPRESSED_LINES linhas descomprimidas)"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error
