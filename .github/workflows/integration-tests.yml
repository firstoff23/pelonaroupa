name: Integration Tests (Supabase Local)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Supabase Local + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Supabase images
        id: cache-supabase
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ runner.os }}-v1

      - name: Load cached images
        if: steps.cache-supabase.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Supabase local
        run: supabase start
        timeout-minutes: 10

      - name: Save images to cache
        if: steps.cache-supabase.outputs.cache-hit != 'true' && success()
        run: |
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'supabase|public.ecr.aws') -o /tmp/supabase-images.tar || true
          ls -lh /tmp/supabase-images.tar

      - name: Get Supabase credentials
        id: supabase
        run: |
          echo "url=$(supabase status -o env | grep '^API_URL' | cut -d= -f2 | tr -d '\"')" >> $GITHUB_OUTPUT
          echo "key=$(supabase status -o env | grep '^SERVICE_ROLE_KEY' | cut -d= -f2 | tr -d '\"')" >> $GITHUB_OUTPUT

      - name: Run integration tests
        env:
          SUPABASE_TEST_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.key }}
        run: pnpm exec vitest run server/mfa.verify.test.ts server/supabase.integration.test.ts

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
