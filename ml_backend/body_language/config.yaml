project: animalmind-body-language-v1
seed: 42

# Ultralytics Dog-Pose ordering (24 x [x, y, visibility]).
# Source images are from Stanford Dogs / ImageNet and the current
# Ultralytics dataset is research-use restricted; do not ship it as
# a production training dependency without a licensing review.
keypoints:
  expected: 24
  coordinate_dim: 3
  names:
    - front_left_paw
    - front_left_knee
    - front_left_elbow
    - rear_left_paw
    - rear_left_knee
    - rear_left_elbow
    - front_right_paw
    - front_right_knee
    - front_right_elbow
    - rear_right_paw
    - rear_right_knee
    - rear_right_elbow
    - tail_start
    - tail_end
    - left_ear_base
    - right_ear_base
    - nose
    - chin
    - left_ear_tip
    - right_ear_tip
    - left_eye
    - right_eye
    - withers
    - throat
  normalize:
    center: withers
    scale: withers_to_throat

heads:
  posture:
    - standing
    - sitting
    - lying
    - crouching
  head:
    - raised
    - neutral
    - lowered
  ears:
    - forward
    - neutral
    - backward
    - unknown
  tail:
    - high
    - neutral
    - low
    - tucked
    - unknown
  movement:
    - still
    - walking
    - running
    - shaking
    - unknown

training:
  batch_size: 64
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.20
  early_stopping_patience: 7
  label_smoothing: 0.05

validation:
  split: animal_id
  metrics:
    - macro_f1
    - weighted_f1
    - accuracy
    - calibration
